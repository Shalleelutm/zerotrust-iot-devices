name: CI

on: [push, pull_request]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check every Python file
        run: |
          python -m py_compile $(find . -name "*.py" -not -path "./venv/*")
      - name: Verify audit chain module imports cleanly
        run: |
          python -c "import ast; ast.parse(open('gateway/audit_chain.py').read())"
